name: telegram-route-checks
on:
  pull_request:
    paths: ['app/**', 'tools/check_telegram_route_nat.sh', '.github/workflows/telegram-routes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Actual client, TLS CONNECT, startup, polling and uncertainty
        run: go test -race -v -count=1 -timeout=180s ./app -run '^TestTelegramRoutes'
      - name: Prove DNAT makes explicit-IP probes misleading (isolated network namespace)
        run: sh tools/check_telegram_route_nat.sh
