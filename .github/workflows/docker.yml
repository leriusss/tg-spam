name: docker

on:
  workflow_run:
    workflows: [build-app]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Build only, or explicitly publish a unique verification image
        type: choice
        options: [build-only, verify-publish]
        default: build-only

permissions:
  contents: read

# Serialize tag mutations; do not cancel a manifest publication in progress.
concurrency:
  group: ghcr-publication
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      image: ${{ steps.gate.outputs.image }}
      publish: ${{ steps.gate.outputs.publish }}
      automatic: ${{ steps.gate.outputs.automatic }}
    steps:
      - uses: actions/github-script@v7
        id: gate
        with:
          script: |
            const repo = context.repo;
            const full = `${repo.owner}/${repo.repo}`;
            if (full !== 'leriusss/tg-spam') throw new Error('Unexpected repository');
            let sha = context.sha;
            let publish = false;
            let automatic = false;
            if (context.eventName === 'workflow_run') {
              const r = context.payload.workflow_run;
              if (r.conclusion !== 'success' || r.event !== 'push' ||
                  r.name !== 'build-app' || r.path !== '.github/workflows/ci.yml' ||
                  r.repository.full_name !== full || r.head_repository.full_name !== full ||
                  r.head_branch !== 'master' || r.pull_requests.length !== 0) return;
              sha = r.head_sha;
              publish = automatic = true;
            } else if (context.eventName === 'workflow_dispatch') {
              publish = context.payload.inputs.mode === 'verify-publish';
              if (publish) {
                // An explicit operator request still needs successful same-repository push CI.
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', status: 'success'
                });
                if (!runs.some(r => r.head_sha === sha && r.head_repository.full_name === full &&
                    r.path === '.github/workflows/ci.yml' && r.event === 'push')) {
                  throw new Error('No successful build-app push run for this exact SHA');
                }
              }
            } else return;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid SHA');
            core.setOutput('sha', sha);
            core.setOutput('image', `ghcr.io/${full.toLowerCase()}`);
            core.setOutput('publish', String(publish));
            core.setOutput('automatic', String(automatic));

  build-only:
    needs: gate
    if: needs.gate.outputs.sha != '' && needs.gate.outputs.publish == 'false'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            CI=github
            GITHUB_SHA=${{ needs.gate.outputs.sha }}
            GIT_BRANCH=verified
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
          load: true
          push: false
          tags: tg-spam:check
      - name: Verify local image revision and safe command
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          test "$(docker image inspect tg-spam:check --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SHA"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /srv/tg-spam tg-spam:check --help > /tmp/help.txt 2>&1 || test "$?" -eq 2
          grep -q "Usage:" /tmp/help.txt
          cat /tmp/help.txt

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            CI=github
            GITHUB_SHA=${{ needs.gate.outputs.sha }}
            GIT_BRANCH=verified
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
          outputs: type=image,name=${{ needs.gate.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 7

  merge:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    env:
      IMAGE: ${{ needs.gate.outputs.image }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create immutable verification or commit manifest
        id: manifest
        env:
          AUTOMATIC: ${{ needs.gate.outputs.automatic }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/digests/*)
          test "${#files[@]}" -eq 2
          sources=()
          for f in "${files[@]}"; do
            d="${f##*/}"
            [[ "$d" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$d")
          done
          tag="verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$SHA"
          if [[ "$AUTOMATIC" == true ]]; then tag="sha-$SHA"; fi
          docker buildx imagetools create --metadata-file /tmp/metadata.json \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:$tag" "${sources[@]}"
          digest=$(jq -er '."containerimage.descriptor".digest' /tmp/metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$tag -> $IMAGE@$digest (revision $SHA)" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE@$digest" --raw > /tmp/manifest.json
          jq -e --arg sha "$SHA" '
            .annotations["org.opencontainers.image.revision"] == $sha and
            ([.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"])
          ' /tmp/manifest.json
      - name: Move master only if this is still the current source tip
        if: needs.gate.outputs.automatic == 'true'
        uses: actions/github-script@v7
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        with:
          script: |
            const {data: ref} = await github.rest.git.getRef({...context.repo, ref: 'heads/master'});
            if (ref.object.sha !== process.env.SHA) {
              core.notice('Stale build: immutable SHA image retained, master tag unchanged');
              return;
            }
            await exec.exec('docker', ['buildx', 'imagetools', 'create',
              '-t', `${process.env.IMAGE}:master`, `${process.env.IMAGE}@${process.env.DIGEST}`]);

  pull-check:
    needs: [gate, merge]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      IMAGE: ${{ needs.gate.outputs.image }}
      SHA: ${{ needs.gate.outputs.sha }}
      DIGEST: ${{ needs.merge.outputs.digest }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Pull exact digest on isolated runner and check both configs
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > /tmp/index.json
          for arch in amd64 arm64; do
            child=$(jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' /tmp/index.json)
            docker buildx imagetools inspect "$IMAGE@$child" --format '{{json .Image}}' > /tmp/config.json
            jq -e --arg sha "$SHA" --arg source "https://github.com/$GITHUB_REPOSITORY" '.config.Labels["org.opencontainers.image.revision"] == $sha and .config.Labels["org.opencontainers.image.source"] == $source' /tmp/config.json
          done
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SHA"
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /srv/tg-spam "$IMAGE@$DIGEST" --help > /tmp/help.txt 2>&1 || test "$?" -eq 2
          grep -q "Usage:" /tmp/help.txt
          cat /tmp/help.txt
          echo "Pulled and safely executed $IMAGE@$DIGEST; revision $SHA" >> "$GITHUB_STEP_SUMMARY"
