name: e2e-ui

on:
  push:
    branches: [master]
    paths: ["app/**", "lib/**", "e2e-ui/**", "tools/playwright/**", ".github/workflows/e2e-ui.yml"]
  pull_request:
    paths: ["app/**", "lib/**", "e2e-ui/**", "tools/playwright/**", ".github/workflows/e2e-ui.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"

      - name: verify pinned tool versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(go list -m -f '{{.Version}}' github.com/playwright-community/playwright-go)" = v0.5200.1
          test "$(node -p 'require("./tools/playwright/package-lock.json").packages["node_modules/playwright-core"].version')" = 1.52.0
          test "$(npm --version)" = 10.9.2
          echo "PLAYWRIGHT_NODEJS_PATH=$(command -v node)" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_DRIVER_PATH=$RUNNER_TEMP/playwright-driver/1.52.0" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers/1.52.0" >> "$GITHUB_ENV"

      # PR validation always installs Chromium from an empty runner-local path.
      - name: cache playwright browsers
        if: github.event_name == 'push'
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-v2-${{ runner.os }}-${{ runner.arch }}-node22.14.0-driver1.52.0-${{ hashFiles('go.sum', 'tools/playwright/package-lock.json') }}

      - name: prepare integrity-checked driver from npm
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tools/playwright --ignore-scripts --no-audit --no-fund
          mkdir -p "$PLAYWRIGHT_DRIVER_PATH"
          ln -s "$GITHUB_WORKSPACE/tools/playwright/node_modules/playwright-core" "$PLAYWRIGHT_DRIVER_PATH/package"
          test "$("$PLAYWRIGHT_NODEJS_PATH" "$PLAYWRIGHT_DRIVER_PATH/package/cli.js" --version)" = 'Version 1.52.0'
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
          fi

      - name: install playwright browsers and dependencies
        run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.5200.1 install --with-deps chromium

      - name: run complete e2e ui suite
        run: go test -v -count=1 -timeout=5m -tags=e2e ./e2e-ui/...
