name: moderation-recovery-checks
on:
  push:
    branches: [codex/moderation-recovery-stage2]
  pull_request:
    paths: ['app/**', 'tools/**', '.github/workflows/moderation-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Focused recovery, safety and SQLite race checks
        run: go test -race -short -timeout=180s ./app/moderation ./app/events ./app/storage ./app
      - name: Full project including PostgreSQL and capacity probe
        run: go test -race -timeout=300s ./...
      - name: Compile with race instrumentation
        if: always()
        run: go build -race ./...
      - name: Lint changed code
        if: always()
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
          golangci-lint run --new-from-rev=44d5999c44554acef747d7e44ed11709ea513212
